<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F3F5F2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(72 55)">
      <rect x="0" y="16" width="47" height="13" rx="3" fill="#E8D996"/>
      <path d="M43 22a15 15 0 1 1 0 30H28V37a15 15 0 0 1 15-15Z" fill="#A7C080" stroke="#202B27" stroke-width="1.5"/>
      <text x="43" y="43" font-size="20" text-anchor="middle" fill="#202B27">1</text>
      <text x="78" y="40" font-size="31" font-weight="600" fill="#202B27">Codex Style Annotations</text>
    </g>
    <g fill="#202B27">
      <text x="72" y="238" font-size="72" font-weight="700" letter-spacing="-2.8">Point to the</text>
      <text x="72" y="321" font-size="72" font-weight="700" letter-spacing="-2.8">exact text.</text>
      <text x="76" y="397" font-size="30">Give your agent a selection</text>
      <text x="76" y="438" font-size="30">and the comment that goes with it.</text>
    </g>
    <g font-size="25" fill="#627069">
      <text x="76" y="537">Chat</text>
      <text x="171" y="537">File</text>
      <text x="253" y="537">Markdown</text>
      <text x="410" y="537">Diff</text>
      <text x="487" y="537">Terminal</text>
    </g>
    <line x1="76" y1="566" x2="651" y2="566" stroke="#CFD7CF"/>
    <text x="76" y="630" font-size="28" fill="#202B27">Select text. Add to your draft.</text>
    <text x="76" y="674" font-size="24" fill="#627069">Add a comment if you need one.</text>
    <text x="76" y="716" font-size="24" fill="#627069">Send when you're ready.</text>
    <rect x="736" y="138" width="800" height="652" rx="28" fill="#1A211D"/>
    <text x="774" y="187" font-size="22" fill="#A4B0A7">Illustrated workflow with sample content; labels shown in English</text>
    <line x1="774" y1="215" x2="1498" y2="215" stroke="#364139"/>
    <text x="778" y="280" font-size="25" fill="#A4B0A7">Agent reply</text>
    <rect x="777" y="310" width="648" height="45" fill="#E8D996" fill-opacity=".25"/>
    <text x="782" y="342" font-size="30" fill="#EBF0E8">Keep the current success example.</text>
    <path d="M1450 328a22 22 0 1 1 0 44h-22v-22a22 22 0 0 1 22-22Z" fill="#A7C080" stroke="#E7EDDE" stroke-width="2"/>
    <text x="1450" y="359" font-size="26" text-anchor="middle" fill="#1A211D">1</text>
    <rect x="820" y="397" width="638" height="214" rx="26" fill="#303833" stroke="#57635A" stroke-width="2"/>
    <text x="850" y="447" font-size="28" fill="#EBF0E8">Also show what happens</text>
    <text x="850" y="487" font-size="28" fill="#EBF0E8">when the connection fails.</text>
    <g transform="translate(852 542)" fill="none" stroke="#BEC8BE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0h26M8 0v-5h10v5M4 4l2 22h14l2-22M10 8v13M16 8v13"/>
    </g>
    <rect x="1207" y="532" width="122" height="48" rx="24" fill="none" stroke="#57635A"/>
    <text x="1268" y="563" font-size="22" text-anchor="middle" fill="#BEC8BE">Cancel</text>
    <rect x="1341" y="532" width="87" height="48" rx="24" fill="#EBF0E8"/>
    <text x="1384" y="563" font-size="22" text-anchor="middle" fill="#202B27">Save</text>
    <rect x="778" y="660" width="220" height="54" rx="27" fill="#3E4840" stroke="#57635A"/>
    <g transform="translate(799 677)" fill="none" stroke="#BEC8BE" stroke-width="2" stroke-linejoin="round"><path d="M0 0h21v15H8l-8 6Z"/><path d="M5 5h11M5 9h7"/></g>
    <text x="835" y="694" font-size="24" fill="#D0D8CB">1 annotation</text>
    <text x="1026" y="695" font-size="25" fill="#A4B0A7">Saved in your draft</text>
    <text x="76" y="839" font-size="23" fill="#627069">A Paseo plugin for selected text and optional comments</text>
  </g>
